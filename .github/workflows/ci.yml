name: CI

# Corre en cada Pull Request hacia main y cuando algo entra a main.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar el estilo del codigo (lint)
        run: npm run lint

      - name: Compilar
        run: npm run build